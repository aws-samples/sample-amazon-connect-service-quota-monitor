name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN (CKV2_GHA_1): CI only needs to read the repo.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.6
      - run: ruff check .   # rules pinned in ruff.toml

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"
      - name: Format check
        run: terraform -chdir=terraform fmt -recursive -check
      - name: Init (no backend) and validate
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

  edge-auth-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check the Lambda@Edge handler
        run: node --check terraform/modules/live-refresh/edge-auth/index.js
      - name: Unit test the Lambda@Edge auth handler
        run: node --test terraform/modules/live-refresh/edge-auth/index.test.js

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt
      - name: Secret scan
        run: |
          if git grep -nE "AKIA[A-Z0-9]{16}|sk_live_" -- '*.py' '*.json' '*.yaml' '*.tf' '*.tftpl' '*.js'; then
            echo "Secret-like string found"; exit 1
          fi
          echo "No secrets found"
      - name: Check for hardcoded account IDs
        run: |
          # git grep's ERE does not support \b, so match the bare 12-digit run and
          # filter known placeholders plus lines containing a GUID (whose final
          # segment is 12 hex and can look like a 12-digit run).
          if git grep -nE "[0-9]{12}" -- '*.py' '*.yaml' '*.tf' '*.tftpl' '*.js' \
              | grep -vE "YOUR_ACCOUNT|example|000000000000|123456789012|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}"; then
            echo "Possible hardcoded account ID"; exit 1
          fi
          echo "Clean"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest boto3 moto
      - run: python -m pytest tests/ -v
