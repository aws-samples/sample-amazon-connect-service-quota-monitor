name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN (CKV2_GHA_1): CI only needs to read the repo.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check . --ignore E501

  cfn-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cfn-lint
      - run: cfn-lint connect-quota-monitor-cfn.yaml
      - run: cfn-lint live-refresh/template.yaml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt
      - name: Secret scan
        run: |
          if git grep -nE "AKIA[A-Z0-9]{16}|sk_live_" -- '*.py' '*.json' '*.yaml'; then
            echo "Secret-like string found"; exit 1
          fi
          echo "No secrets found"
      - name: Check for hardcoded account IDs
        run: |
          if git grep -nE "\b[0-9]{12}\b" -- '*.py' '*.yaml' | grep -vE "YOUR_ACCOUNT|example|000000000000|123456789012"; then
            echo "Possible hardcoded account ID"; exit 1
          fi
          echo "Clean"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest boto3 moto
      - run: python -m pytest tests/ -v
