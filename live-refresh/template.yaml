AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Connect Operations Dashboard — Live Metrics API.
  Deploys a Lambda function behind API Gateway that serves real-time
  CloudWatch metrics to the Connect Operations Dashboard.

Parameters:
  ConnectInstanceId:
    Type: String
    Description: Amazon Connect Instance ID
    AllowedPattern: '[a-f0-9-]+'

  LineConfigJson:
    Type: String
    Description: Inline JSON line configuration (for small configs)
    Default: ''

  LineConfigS3Bucket:
    Type: String
    Description: S3 bucket containing line-config.json (alternative to inline)
    Default: ''

  LineConfigS3Key:
    Type: String
    Description: S3 key for line-config.json
    Default: 'line-config.json'

  ReportBucket:
    Type: String
    Description: S3 bucket for dashboard reports, archives, and peak files
    Default: ''

  ScheduleRate:
    Type: String
    Description: How frequently the metrics Lambda runs (e.g., rate(1 hour), rate(15 minutes))
    Default: 'rate(1 hour)'

  HistoryApiUrl:
    Type: String
    Description: >
      Optional absolute URL of this API's /quota endpoint, used only to enable the
      7-day trend fetch in the lightweight fallback dashboard. Leave blank on the
      first deploy, then set it to the ApiEndpoint output on a subsequent deploy.
      Kept as a parameter (not a !Ref to the API) to avoid a Function<->Api
      circular dependency.
    Default: ''

Globals:
  Function:
    Timeout: 300
    Runtime: python3.13
    MemorySize: 512
    Architectures:
      - arm64

Resources:

  MetricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda_function.lambda_handler
      CodeUri: .
      Description: Serves live CloudWatch metrics for Connect Operations Dashboard
      Environment:
        Variables:
          CONNECT_INSTANCE_ID: !Ref ConnectInstanceId
          LINE_CONFIG_JSON: !Ref LineConfigJson
          LINE_CONFIG_S3_BUCKET: !Ref LineConfigS3Bucket
          LINE_CONFIG_S3_KEY: !Ref LineConfigS3Key
          S3_REPORT_BUCKET: !Ref ReportBucket
          API_ENDPOINT: !Ref HistoryApiUrl
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - cloudwatch:GetMetricData
                - cloudwatch:GetMetricStatistics
              Resource: '*'
            - Effect: Allow
              Action:
                # ListServiceQuotas only; the code no longer makes per-quota
                # GetServiceQuota calls (it batches via ListServiceQuotas).
                - servicequotas:ListServiceQuotas
              Resource: '*'
            - !If
              - HasS3Config
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub 'arn:aws:s3:::${LineConfigS3Bucket}/${LineConfigS3Key}'
              - !Ref AWS::NoValue
            - !If
              - HasReportBucket
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub 'arn:aws:s3:::${ReportBucket}/*'
              - !Ref AWS::NoValue
            - !If
              - HasReportBucket
              - Effect: Allow
                # s3:ListBucket is required by the history endpoint's
                # list_objects_v2 call over the archive/ prefix; without it
                # GET /quota?history=1h|1d silently returns empty.
                Action:
                  - s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::${ReportBucket}'
              - !Ref AWS::NoValue
      Events:
        # Path is /quota to match the handler's documented contract
        # (GET /quota, GET /quota?history=...). The OPTIONS preflight is
        # generated by the API's Cors config below, so it is not wired here.
        GetQuota:
          Type: Api
          Properties:
            Path: /quota
            Method: get
            RestApiId: !Ref DashboardApi
        ScheduledRefresh:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleRate
            Description: Periodic metrics collection, archive write, and peak tracking

  DashboardApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      # This endpoint returns non-sensitive quota-utilization metrics and is
      # fetched directly by a browser dashboard, so it is intentionally public
      # read-only. It is NOT API-key protected: an API key embedded in static
      # browser JavaScript protects nothing and is a known anti-pattern. Abuse
      # and runaway cost are bounded by the throttle below (CloudWatch and
      # Service Quotas reads are the only work each request performs). If you
      # need authenticated access, layer IAM (AWS_IAM) or a Cognito authorizer
      # here and sign requests from the dashboard.
      MethodSettings:
        - HttpMethod: '*'
          ResourcePath: /*
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
      Cors:
        AllowMethods: "'GET, OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

Conditions:
  HasS3Config: !Not [!Equals [!Ref LineConfigS3Bucket, '']]
  HasReportBucket: !Not [!Equals [!Ref ReportBucket, '']]

Outputs:
  DashboardURL:
    Description: Bookmark this URL — your dashboard is always here
    Value: !Sub 'http://${ReportBucket}.s3-website-${AWS::Region}.amazonaws.com/'

  ApiEndpoint:
    Description: History API (used by the dashboard for 7-day trend)
    Value: !Sub 'https://${DashboardApi}.execute-api.${AWS::Region}.amazonaws.com/prod/quota'

  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt MetricsFunction.Arn

  EnableWebsiteHosting:
    Description: Run this once to enable S3 static website hosting
    Value: !Sub 'aws s3 website s3://${ReportBucket}/ --index-document index.html'
