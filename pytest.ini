[pytest]
# Collect only the maintained unit/integration suite. This matches the CI
# command (`pytest tests/`) and avoids two problems with a bare `pytest` run
# from the repo root:
#   1. A duplicate module basename (`lambda_function.py` exists both at the root
#      and under live-refresh/), which poisons `import lambda_function`.
#   2. Root-level scratch scripts (e.g. test_html_generation.py) that build a
#      boto3 client at import time and need AWS credentials/region.
testpaths = tests
# importlib mode keeps same-named test modules isolated (no sys.path basename clashes).
addopts = --import-mode=importlib
